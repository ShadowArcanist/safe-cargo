name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'reports/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'reports/**'
      - '*.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Audit
        run: |
          cargo install cargo-audit --version 0.21.2 --locked
          cargo audit
